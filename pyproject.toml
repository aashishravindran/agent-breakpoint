[project]
name = "agent-breakpoint"
version = "0.1.0"
description = "Break an agent system's model, tools, dependencies and state on purpose, and get a graded tolerance matrix."
readme = "README.md"
license = "MIT"
authors = [{ name = "Aashish Ravindran", email = "raashish5594.ar@gmail.com" }]
requires-python = ">=3.11"
keywords = ["agents", "chaos-engineering", "fault-injection", "mcp", "langgraph", "testing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "rich>=13.0",
    "starlette>=0.37",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
mcp = ["mcp>=1.9"]
bedrock = ["botocore>=1.34"]
langgraph = ["langgraph>=0.2", "langgraph-checkpoint>=2.0"]
all = ["agent-breakpoint[mcp,bedrock,langgraph]"]

[project.scripts]
agent-breakpoint = "agent_breakpoint.cli:main"

[project.entry-points.pytest11]
agent_breakpoint = "agent_breakpoint.pytest_plugin"

[project.entry-points."agent_breakpoint.packs"]
model = "agent_breakpoint.faults.model:PACK"
context = "agent_breakpoint.faults.context:PACK"
tools = "agent_breakpoint.faults.tools:PACK"
dependency = "agent_breakpoint.faults.dependency:PACK"
state = "agent_breakpoint.faults.state:PACK"
orchestration = "agent_breakpoint.faults.orchestration:PACK"
budget = "agent_breakpoint.faults.budget:PACK"
planning = "agent_breakpoint.faults.planning:PACK"

[project.entry-points."agent_breakpoint.safety"]
side_effect_ledger = "agent_breakpoint.oracles.safety:SideEffectLedger"
destructive_after_fault = "agent_breakpoint.oracles.safety:DestructiveAfterFault"
budget_cap = "agent_breakpoint.oracles.safety:BudgetCap"
canary_leak = "agent_breakpoint.oracles.safety:CanaryLeak"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mcp>=1.9",
    "botocore>=1.34",
    "langgraph>=0.2",
    "langgraph-checkpoint>=2.0",
    "ruff>=0.6",
    "langgraph-checkpoint-sqlite>=3.1.3",
]

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 112
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008", "SIM105", "SIM108", "RUF001", "RUF002", "RUF003", "RUF012", "UP038", "UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "E402"]
